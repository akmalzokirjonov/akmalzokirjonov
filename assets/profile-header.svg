      <text x="45" y="125" fill="#F3F7FC" font-size="48" font-weight="700" letter-spacing="-1.3">Akmal Zokirjonov</text>
      <text x="48" y="168" fill="#C7D7E4" font-size="21">Practical software for everyday work.</text>
      <text x="48" y="231" fill="#A6BDC9" font-size="15" letter-spacing="0.6">Web products<tspan dx="18" fill="#72E4BD">/</tspan><tspan dx="18">Automation</tspan><tspan dx="18" fill="#72E4BD">/</tspan><tspan dx="18">Telegram bots</tspan></text>
    </g>
    <g stroke="#72E4BD" stroke-width="1.5" stroke-opacity="0.3">
      <path d="M764 90V56H902V92M902 190V228H768V190"/>
      <path d="M718 140H689M944 140H974"/>
    </g>
    <rect x="723" y="91" width="216" height="98" rx="16" fill="#122533" stroke="#355664"/>
    <g stroke="#72E4BD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M784 122L764 140L784 158"/>
      <path d="M876 122L896 140L876 158"/>
      <path d="M840 115L821 165"/>
