<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Akmal Zokirjonov — Full-stack developer</title>
  <desc id="description">Web products, automation, and Telegram bots. A navy banner with mint accents and a geometric code illustration.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1000" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111C2D"/>
      <stop offset="1" stop-color="#172D3A"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9CB8C8" stroke-opacity="0.07"/>
